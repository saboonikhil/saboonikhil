<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Kahwa">
  <!-- Steam / vapour -->
  <g stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M10.5 5.5c0-1.2.8-2 1-3.2">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -1;0 2" dur="2.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M16 3.5c0-1.2.8-2 1-3.2">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -1.5;0 2" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M21.5 5.5c0-1.2.8-2 1-3.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -1;0 2" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Cup -->
  <path d="M7 11h17.5l-1.6 12.5H8.6L7 11z" stroke="#1f2328" stroke-width="1.85" stroke-linejoin="round"/>
  <path d="M24.5 12.5h2.2a2.2 2.2 0 0 1 0 4.4h-2.2" stroke="#1f2328" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6 25.5h20" stroke="#1f2328" stroke-width="1.85" stroke-linecap="round"/>
</svg>
